name: Team progress
on:
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled, assigned, unassigned]
  issue_comment:
    types: [created, edited, deleted]
  pull_request_target:
    types: [opened, edited, synchronize, reopened, closed, ready_for_review, converted_to_draft]
  push:
    branches: [main]
    paths: [coordination/**, .github/workflows/team-progress.yml]
  workflow_dispatch:
permissions:
  contents: read
  issues: write
  pull-requests: read
concurrency:
  group: wayfare-team-progress
  cancel-in-progress: false
jobs:
  dashboard:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Verify coordination rules
        run: node --test coordination/update-dashboard.test.cjs
      - uses: actions/github-script@v8
        with:
          script: |
            const { main } = require('./coordination/update-dashboard.cjs');
            await main({ github, context, core });
