name: Demo (GitHub Pages, sample mode)

# Publishes the sample-mode production build (docs/DEMO.md) to GitHub Pages.
# Sample mode only: no API URL, no secrets, no AI key. Requires Settings ->
# Pages -> Source: "GitHub Actions". The deploy step fails until that is set.
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: wayfare-demo-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read   # configure-pages reads the Pages site config (403 without it)
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Select the published npm version
        run: npm install --global npm@11.19.0
      - name: Install locked dependencies
        run: npm ci
      - name: Sample-mode production build
        run: npm run build
        env:
          WAYFARE_SOURCE_SHA: ${{ github.sha }}
          VITE_WAYFARE_API_URL: ''
      - name: Check provenance
        run: |
          grep -q '"mode": "sample"' dist/version.json
          grep -q "\"source\": \"${GITHUB_SHA}\"" dist/version.json
          cat dist/version.json
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
      - name: Verify the live build matches this commit
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS "${PAGE_URL}version.json" -o version.json && grep -q "\"source\": \"${GITHUB_SHA}\"" version.json; then
              cat version.json; echo "Live: ${PAGE_URL} serves ${GITHUB_SHA}"; exit 0
            fi
            sleep 10
          done
          echo "Live version.json does not match ${GITHUB_SHA}"; cat version.json || true; exit 1
