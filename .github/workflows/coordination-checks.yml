name: Coordination checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  coordination-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Dashboard behavior tests
        run: node --test coordination/update-dashboard.test.cjs
      - name: Setup safety tests
        run: python3 -m unittest discover -s coordination -p 'test_*.py'
