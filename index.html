<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WayFare</title>
    <!-- The logo mark (src/ui/icons.tsx LogoMark, light accent) inline, so browsers do not request a missing /favicon.ico. -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M5.5 10 L9.6 21.2 C10.6 23.9 12.9 23.9 13.9 21.2 L16 15.5 L18.1 21.2 C19.1 23.9 21.4 23.9 22.4 21.2 L24.2 16.4' fill='none' stroke='%231f5fa8' stroke-width='4.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='26.6' cy='10' r='2.7' fill='%231f5fa8'/%3E%3C/svg%3E" />
    <script>
      /* Colour mode before first paint (see src/app/theme.ts). */
      (function () {
        var m = null;
        try { m = localStorage.getItem('wayfare:v1:theme'); } catch (e) {}
        if (m !== 'light' && m !== 'dark') m = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = m;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
